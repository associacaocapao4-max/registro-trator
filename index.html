<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Trator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #eef2f3, #dfe9f3);
      color: #333;
    }

    .topo {
      text-align: center;
      margin-bottom: 25px;
    }

    .topo img {
      width: 150px;
      max-width: 100%;
      margin-bottom: 10px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      background: white;
      padding: 10px;
    }

    .topo h2 {
      margin: 0;
      font-size: 32px;
      color: #1f3c88;
    }

    .formulario {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      margin-top: 12px;
      display: block;
      color: #333;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      box-sizing: border-box;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #1f3c88;
      box-shadow: 0 0 5px rgba(31,60,136,0.4);
    }

    .botoes-acoes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    button {
      cursor: pointer;
      border: none;
      font-weight: bold;
      transition: 0.2s;
      color: white;
    }

    button:hover {
      transform: scale(1.02);
    }

    button:not(.btn-apagar):not(.btn-sync) {
      background: #2563eb;
    }

    button:not(.btn-apagar):not(.btn-sync):hover {
      background: #1d4ed8;
    }

    .btn-sync {
      background: #16a34a;
    }

    .btn-sync:hover {
      background: #15803d;
    }

    .btn-apagar {
      background: #dc2626;
    }

    .btn-apagar:hover {
      background: #b91c1c;
    }

    #mensagem {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      display: none;
    }

    .sucesso {
      background-color: #dcfce7;
      color: #166534;
    }

    .erro {
      background-color: #fee2e2;
      color: #991b1b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      margin-top: 20px;
    }

    th {
      background: #1f3c88;
      color: white;
      padding: 12px;
      font-size: 14px;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    tr:hover {
      background: #f1f5f9;
    }

    td button {
      width: auto;
      padding: 8px 12px;
      border-radius: 8px;
      background: #ef4444;
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .topo h2 {
        font-size: 24px;
      }

      table {
        font-size: 12px;
      }

      th,
      td {
        padding: 6px;
      }
    }
  </style>
</head>

<body>
  <div class="topo">
    <img src="APPMCV.png" alt="Logo APPMCV">
    <h2>🚜 Registro de Trator</h2>
  </div>

  <div class="formulario">
    <label for="data">Data:</label>
    <input type="date" id="data">

    <label for="operador">Operador:</label>
    <input type="text" id="operador" value="RICARDO" readonly>

    <label for="associado">Associado:</label>
    <input type="text" id="associado">

    <label for="tipo">Tipo:</label>
    <select id="tipo">
      <option value="">Selecione</option>
      <option value="Socio">Sócio</option>
      <option value="Nao Socio">Não Sócio</option>
      <option value="Diretoria">Diretoria</option>
    </select>

    <label for="modelo">Modelo:</label>
    <select id="modelo">
      <option value="">Selecione</option>
      <option value="New Holland TL - 75">New Holland TL - 75</option>
      <option value="Solis - 75">Solis - 75</option>
    </select>

    <label for="atividade">Atividade:</label>
    <select id="atividade">
      <option value="">Selecione</option>
      <option value="Arado">Arado</option>
      <option value="Canterador">Canterador</option>
      <option value="Carretinha">Carretinha</option>
      <option value="Deslocamento">Deslocamento</option>
      <option value="Gincho">Gincho</option>
      <option value="Grade">Grade</option>
      <option value="Retirar do Atoleiro">Retirar do Atoleiro</option>
    </select>

    <label for="horimetroInicial">Horímetro Inicial:</label>
    <input type="number" id="horimetroInicial" step="any">

    <label for="horimetroFinal">Horímetro Final:</label>
    <input type="number" id="horimetroFinal" step="any">

    <div class="botoes-acoes">
      <button onclick="registrar()">Registrar</button>
      <button onclick="exportarCSV()">CSV</button>
      <button id="btnSync" class="btn-sync" onclick="sincronizarPendentes()" disabled>
        🔄 Sincronizar
      </button>
      <button class="btn-apagar" onclick="limparTodos()">Apagar Tudo</button>
    </div>

    <div id="mensagem"></div>
  </div>

  <table id="tabela">
    <thead>
      <tr>
        <th>Data</th>
        <th>Operador</th>
        <th>Associado</th>
        <th>Tipo</th>
        <th>Modelo</th>
        <th>Atividade</th>
        <th>Inicial</th>
        <th>Final</th>
        <th>Horas</th>
        <th>Valor</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const URL_SCRIPT =
      "https://script.google.com/macros/s/AKfycbxmjIPO_4f0iCEEhsgonCRtrSMRcCt_Ac7cYVe--pTH9rpfl0woLn6fbim-tk7ln_C0lw/exec";

    let registros =
      JSON.parse(localStorage.getItem("registrosTrator")) || [];

    let registrosPendentes =
      JSON.parse(localStorage.getItem("registrosPendentes")) || [];

    function salvarLocal() {
      localStorage.setItem(
        "registrosTrator",
        JSON.stringify(registros)
      );
    }

    function salvarPendentes() {
      localStorage.setItem(
        "registrosPendentes",
        JSON.stringify(registrosPendentes)
      );
    }

    function mostrarMensagem(texto, tipo) {
      const msg = document.getElementById("mensagem");
      msg.textContent = texto;
      msg.className = tipo;
      msg.style.display = "block";

      setTimeout(() => {
        msg.style.display = "none";
      }, 3000);
    }

    function calcularHoras(i, f) {
      return f - i < 0 ? 0 : (f - i).toFixed(2);
    }

    async function enviarParaGoogleSheets(dados) {
      try {
        const resposta = await fetch(URL_SCRIPT, {
          method: "POST",
          body: JSON.stringify(dados)
        });

        if (!resposta.ok) throw new Error("erro");

        mostrarMensagem("✅ Enviado!", "sucesso");
      } catch (e) {
        registrosPendentes.push(dados);
        salvarPendentes();
        atualizarBotaoSync();
        mostrarMensagem("📴 Salvo offline", "erro");
      }
    }

    async function sincronizarPendentes() {
      if (registrosPendentes.length === 0) {
        mostrarMensagem("Nada pendente", "sucesso");
        return;
      }

      if (!navigator.onLine) {
        mostrarMensagem("Sem internet", "erro");
        return;
      }

      let enviados = [];

      for (let r of registrosPendentes) {
        try {
          const res = await fetch(URL_SCRIPT, {
            method: "POST",
            body: JSON.stringify(r)
          });

          if (res.ok) enviados.push(r);
        } catch (e) {}
      }

      registrosPendentes =
        registrosPendentes.filter(r => !enviados.includes(r));

      salvarPendentes();
      atualizarBotaoSync();

      mostrarMensagem(`${enviados.length} sincronizados`, "sucesso");
    }

    function atualizarBotaoSync() {
      const btn = document.getElementById("btnSync");

      if (registrosPendentes.length > 0) {
        btn.disabled = false;
        btn.innerText = `🔄 (${registrosPendentes.length})`;
      } else {
        btn.disabled = true;
        btn.innerText = "OK";
      }
    }

    function registrar() {
      let horasTrabalhadas = calcularHoras(
        parseFloat(document.getElementById("horimetroInicial").value),
        parseFloat(document.getElementById("horimetroFinal").value)
      );

      let valorHora = 0;
      const tipoSelecionado = document.getElementById("tipo").value;

      if (tipoSelecionado === "Socio") {
        valorHora = 200;
      }

      if (tipoSelecionado === "Nao Socio") {
        valorHora = 260;
      }

      if (tipoSelecionado === "Diretoria") {
        valorHora = 170;
      }

      let valorCalculado = horasTrabalhadas * valorHora;

      let dados = {
        data: document.getElementById("data").value,
        operador: document.getElementById("operador").value,
        associado: document.getElementById("associado").value,
        tipo: tipoSelecionado,
        modelo: document.getElementById("modelo").value,
        atividade: document.getElementById("atividade").value,
        horimetroInicial: parseFloat(document.getElementById("horimetroInicial").value),
        horimetroFinal: parseFloat(document.getElementById("horimetroFinal").value),
        horasTrabalhadas: Number(horasTrabalhadas).toFixed(2),
        valor: Number(valorCalculado).toFixed(2)
      };

      if (
        !dados.data ||
        !dados.tipo ||
        !dados.modelo ||
        !dados.atividade ||
        isNaN(dados.horimetroInicial) ||
        isNaN(dados.horimetroFinal)
      ) {
        return mostrarMensagem("Preencha tudo", "erro");
      }

      registros.push(dados);
      salvarLocal();
      atualizarTabela();

      if (navigator.onLine) {
        enviarParaGoogleSheets(dados);
      } else {
        registrosPendentes.push(dados);
        salvarPendentes();
        atualizarBotaoSync();
        mostrarMensagem("📴 Salvo offline", "erro");
      }

      document.getElementById("associado").value = "";
      document.getElementById("tipo").value = "";
      document.getElementById("modelo").value = "";
      document.getElementById("atividade").value = "";
      document.getElementById("horimetroInicial").value = "";
      document.getElementById("horimetroFinal").value = "";
    }

    function atualizarTabela() {
      let tbody = document.querySelector("#tabela tbody");
      tbody.innerHTML = "";

      registros.forEach((r, i) => {
        tbody.innerHTML += `
          <tr>
            <td>${r.data}</td>
            <td>${r.operador}</td>
            <td>${r.associado}</td>
            <td>${r.tipo}</td>
            <td>${r.modelo}</td>
            <td>${r.atividade}</td>
            <td>${r.horimetroInicial}</td>
            <td>${r.horimetroFinal}</td>
            <td>${r.horasTrabalhadas}</td>
            <td>R$ ${Number(r.valor).toFixed(2)}</td>
            <td>
              <button onclick="apagar(${i})">🗑️</button>
            </td>
          </tr>
        `;
      });
    }

    function apagar(i) {
      registros.splice(i, 1);
      salvarLocal();
      atualizarTabela();
    }

    function limparTodos() {
      registros = [];
      salvarLocal();
      atualizarTabela();
    }

    function exportarCSV() {
      // Ponto e vírgula separa as colunas corretamente no Excel em português.
      function campoCSV(valor) {
        let texto = String(valor ?? "");
        if (/^[+-]?\d+\.\d+$/.test(texto)) {
          texto = texto.replace(".", ",");
        }
        return '"' + texto.replace(/"/g, '""') + '"';
      }

      const colunas = [
        "Data", "Operador", "Associado", "Tipo", "Modelo",
        "Atividade", "Inicial", "Final", "Horas", "Valor"
      ];

      let linhas = [colunas.map(campoCSV).join(";")];

      registros.forEach(r => {
        linhas.push([
          r.data,
          r.operador,
          r.associado,
          r.tipo,
          r.modelo,
          r.atividade,
          r.horimetroInicial,
          r.horimetroFinal,
          r.horasTrabalhadas,
          r.valor
        ].map(campoCSV).join(";"));
      });

      const csv = "\uFEFF" + linhas.join("\r\n");
      const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
      });

      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "registros.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    window.addEventListener("online", sincronizarPendentes);

    atualizarTabela();
    atualizarBotaoSync();
  </script>
</body>
</html>
